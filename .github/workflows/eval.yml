name: eval

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scorer and benchmark tests
        run: npm test
      - name: Benchmark + regression gate
        run: npm run eval
